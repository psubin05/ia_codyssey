<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 1.8rem;
            color: #f5c518;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .reset-btn {
            background-color: #e50914;
            color: white;
        }

        .reset-btn:hover {
            background-color: #b80710;
        }

        .add-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1a1a1a;
            color: white;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #f5c518;
        }

        .add-btn {
            background-color: #f5c518;
            color: black;
        }

        .add-btn:hover {
            background-color: #e4b60f;
        }

        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tier-row {
            display: flex;
            min-height: 100px;
            background-color: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }

        .tier-label {
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }

        .tier-s { background-color: #ff7f7f; }
        .tier-a { background-color: #ffbf7f; }
        .tier-b { background-color: #ffdf7f; }
        .tier-c { background-color: #ffff7f; }
        .tier-unclassified { background-color: #858585; color: #fff; }

        .tier-dropzone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            align-items: center;
            min-height: 100px;
        }

        .movie-card {
            background-color: #3a3a3a;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .movie-card:active {
            cursor: grabbing;
        }

        .movie-card.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .unclassified-section {
            background-color: #222;
            border-radius: 8px;
            padding: 15px;
            border: 1px dashed #444;
        }

        .unclassified-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #aaa;
        }

        .alert-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 영화 티어리스트</h1>
        <div class="controls">
            <button class="reset-btn" onclick="resetTiers()">초기화</button>
        </div>
    </header>

    <div class="add-container">
        <input type="text" id="movieInput" placeholder="새 영화 제목을 입력하세요..." onkeypress="handleKeyPress(event)">
        <button class="add-btn" onclick="addMovie()">추가</button>
    </div>

    <div class="tier-container">
        <div class="tier-row">
            <div class="tier-label tier-s">S</div>
            <div class="tier-dropzone" data-tier="S" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-a">A</div>
            <div class="tier-dropzone" data-tier="A" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-b">B</div>
            <div class="tier-dropzone" data-tier="B" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-c">C</div>
            <div class="tier-dropzone" data-tier="C" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
    </div>

    <div class="unclassified-section">
        <h2>미분류 영화</h2>
        <div class="tier-dropzone" data-tier="unclassified" id="unclassifiedZone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
    </div>

    <script>
        const DEFAULT_MOVIES = [
            '기생충', '인터스텔라', '라라랜드', '센과 치히로의 행방불명',
            '어벤져스: 엔드게임', '범죄도시', '타이타닉', '토이 스토리'
        ];

        let state = {
            movies: [] // { id, title, tier }
        };

        // 초기화 및 데이터 로드
        window.onload = function() {
            loadState();
            render();
        };

        function saveState() {
            localStorage.setItem('movieTierList', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('movieTierList');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) {
                    initDefaultState();
                }
            } else {
                initDefaultState();
            }
        }

        function initDefaultState() {
            state.movies = DEFAULT_MOVIES.map((title, index) => ({
                id: 'movie-' + Date.now() + '-' + index,
                title: title,
                tier: 'unclassified'
            }));
            saveState();
        }

        function render() {
            // 모든 드롭존 비우기
            document.querySelectorAll('.tier-dropzone').forEach(zone => zone.innerHTML = '');

            // 카드를 각 등급에 배치
            state.movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.draggable = true;
                card.id = movie.id;
                card.innerText = movie.title;

                card.addEventListener('dragstart', dragStart);
                card.addEventListener('dragend', dragEnd);

                const targetZone = document.querySelector(`.tier-dropzone[data-tier="${movie.tier}"]`);
                if (targetZone) {
                    targetZone.appendChild(card);
                }
            });
        }

        // 드래그 앤 드롭 로직
        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            e.target.classList.add('dragging');
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function drop(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const dropzone = e.target.closest('.tier-dropzone');
            
            if (dropzone && id) {
                const targetTier = dropzone.getAttribute('data-tier');
                const movie = state.movies.find(m => m.id === id);
                if (movie) {
                    movie.tier = targetTier;
                    saveState();
                    render();
                }
            }
        }

        // 영화 추가 기능
        function addMovie() {
            const input = document.getElementById('movieInput');
            const title = input.value.trim();

            if (!title) {
                alert('영화 제목을 입력해 주세요.');
                return;
            }

            const newMovie = {
                id: 'movie-' + Date.now(),
                title: title,
                tier: 'unclassified'
            };

            state.movies.push(newMovie);
            saveState();
            render();

            input.value = '';
            input.focus();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                addMovie();
            }
        }

        // 초기화 기능
        function resetTiers() {
            if (confirm('모든 배치를 초기화하고 처음 상태로 돌아가시겠습니까?')) {
                localStorage.removeItem('movieTierList');
                initDefaultState();
                render();
            }
        }
    </script>
</body>
</html>
