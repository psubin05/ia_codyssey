<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포근한 하루 — 하루 일정 관리</title>
<style>
:root{--ink:#49382d;--muted:#79685b;--line:#e8dbce;--cream:#faf5ed;--peach:#f5d3bb;--brown:#754b35}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 system-ui,'Malgun Gothic',sans-serif}main{max-width:1180px;margin:auto;padding:36px 28px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:21px;margin:0 0 14px}h3{margin:0;font-size:18px}p{margin:4px 0;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--brown);font-weight:700}.datebadge{background:#f1e6d8;border-radius:30px;padding:10px 18px}.panel{background:#fffdfa;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:20px}.today{background:#fff4e7;border-color:#e7c5a9;border-top:5px solid #c88f65}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{font-size:13px;color:var(--muted)}.lower{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}.lower>*{min-width:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#fffdfa;color:var(--ink);padding:7px 12px}button:hover{background:#f8e5d5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9653c;outline-offset:3px}.primary{background:var(--brown);color:white;border-color:var(--brown)}.primary:hover{background:#603b29}.controls{display:flex;gap:5px}.task{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:18px;height:18px;margin-top:5px;accent-color:var(--brown)}.taskbody{flex:1;min-width:0}.title{font-weight:650;overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}.stars{color:#92582c}.late{color:#a53a26;font-weight:700}.actions{display:flex;gap:4px}.actions button{font-size:12px;padding:4px 7px}.empty{padding:20px 0;color:var(--muted);font-size:14px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week{text-align:center;font-size:12px;padding:14px 0 8px;color:var(--muted)}.day{min-height:92px;min-width:0;text-align:left;padding:6px;border-radius:8px;display:flex;flex-direction:column;gap:3px;justify-content:flex-start}.day.selected{background:#f8dfca;border:2px solid #a56f49;padding:5px}.day.istoday .daynum{font-weight:800;text-decoration:underline;text-underline-offset:4px}.daynum{font-size:13px}.preview{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;background:#f4ebe1;border-radius:3px;padding:0 2px}.preview.done{text-decoration:line-through}.more{font-size:10px;color:var(--brown)}.blank{background:#f8f3eb;border-radius:8px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input[type=text],input[type=date],select{width:100%;border:1px solid #d8c8b8;border-radius:8px;padding:10px;background:white;color:var(--ink);min-width:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formactions{display:flex;gap:8px;margin-top:17px}.error{color:#a53a26;font-weight:650}.notice{background:#ffebdf;padding:14px;border:1px solid #b45d40;border-radius:10px;margin-bottom:20px}footer{font-size:12px;color:var(--muted)}[hidden]{display:none!important}
</style>
<main>
<header><div><div class="eyebrow">MY DAILY PLANNER</div><h1>포근한 하루</h1><p>작은 일부터, 나의 속도로 채우는 하루.</p></div><div class="datebadge" id="todaydate"></div></header>
<div id="storageerror" class="notice" role="alert" hidden>일정을 저장할 수 없습니다. 브라우저 저장 설정을 확인해 주세요</div>
<section class="panel today"><div class="sectionhead"><h2>오늘 할 일</h2><span id="todaycount" class="count"></span></div><div id="todaylist"></div></section>
<section class="panel"><h2>지난 미완료</h2><div id="pastlist"></div></section>
<div class="lower"><section class="panel"><div class="sectionhead"><h2 id="monthlabel"></h2><div class="controls"><button id="prev" aria-label="이전 달">‹</button><button id="gotoday">오늘</button><button id="next" aria-label="다음 달">›</button></div></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar" id="calendar"></div></section>
<div><section class="panel"><h2 id="formtitle">새 할 일</h2><form id="form" novalidate>
<label for="title">할 일 제목 · 필수</label><input id="title" type="text" placeholder="어떤 일을 할까요?" required>
<div class="fields"><div><label for="date">예정일 · 필수</label><input id="date" type="date" required></div><div><label for="time">마감 시간 · 선택</label><input id="time" type="text" inputmode="numeric" placeholder="09:00 (24시간 형식)" aria-describedby="timehint"><small id="timehint">없으면 비워 두세요.</small></div></div>
<label for="priority">중요도 · 필수</label><select id="priority" required><option value="1">★☆☆☆☆ · 중요도 1/5</option><option value="2">★★☆☆☆ · 중요도 2/5</option><option value="3" selected>★★★☆☆ · 중요도 3/5</option><option value="4">★★★★☆ · 중요도 4/5</option><option value="5">★★★★★ · 중요도 5/5</option></select>
<p id="formerror" class="error" role="alert"></p><div class="formactions"><button class="primary" id="save">저장하기</button><button type="button" id="cancel" hidden>수정 취소</button></div></form></section>
<section class="panel"><h2 id="selectedlabel"></h2><div id="selectedlist"></div></section></div></div>
<footer>이 브라우저에 일정을 저장합니다. 브라우저 데이터 삭제나 파일 경로 변경 시 기록이 유지되지 않을 수 있습니다.</footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), key='poguen_codex_v1', pad=n=>String(n).padStart(2,'0');
const datekey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let today=datekey(new Date()),selected=today,month=new Date(new Date().getFullYear(),new Date().getMonth(),1),tasks=[],editing=null,serial=0;
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00');return !isNaN(d)&&datekey(d)===s;}
function storageError(){$('storageerror').hidden=false;}
try{const raw=localStorage.getItem(key);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data)||!data.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&validDate(t.date)&&(!t.time||/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time))&&Number.isInteger(t.priority)&&t.priority>=1&&t.priority<=5&&typeof t.done==='boolean'&&Number.isFinite(t.order)))throw Error();tasks=data;serial=Math.max(0,...tasks.map(t=>t.order));}}catch{storageError();}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks));$('storageerror').hidden=true;}catch{storageError();}}
function sorted(list){return [...list].sort((a,b)=>Number(a.done)-Number(b.done)||(a.done?a.order-b.order:b.priority-a.priority||`${a.date}T${a.time||'23:59:59'}`.localeCompare(`${b.date}T${b.time||'23:59:59'}`)||a.order-b.order));}
function overdue(t){return !t.done&&(t.date<today||(t.date===today&&t.time&&new Date(t.date+'T'+t.time)<new Date()));}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function button(text,fn){const b=el('button','',text);b.type='button';b.onclick=fn;return b;}
function list(id,items,empty){const box=$(id);box.replaceChildren();if(!items.length){box.append(el('div','empty',empty));return;}sorted(items).forEach(t=>{const row=el('div','task'+(t.done?' done':'')),check=el('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label',t.title+' 完了'.replace('完了','완료'));check.onchange=()=>{t.done=check.checked;save();render();};const body=el('div','taskbody');body.append(el('div','title',t.title));const meta=el('div','meta');meta.append(el('span','',t.date),el('span','',t.time||'시간 지정 없음'),el('span','stars','★'.repeat(t.priority)+'☆'.repeat(5-t.priority)+` · 중요도 ${t.priority}/5`));if(overdue(t))meta.append(el('span','late','마감 지남'));body.append(meta);const actions=el('div','actions');actions.append(button('수정',()=>edit(t)),button('삭제',()=>{if(confirm(`“${t.title}” 일정을 삭제할까요?`)){tasks=tasks.filter(x=>x.id!==t.id);if(editing===t.id)reset();save();render();}}));row.append(check,body,actions);box.append(row);});}
function render(){today=datekey(new Date());$('todaydate').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const todays=tasks.filter(t=>t.date===today);$('todaycount').textContent=`${todays.filter(t=>!t.done).length}개 남음 · 전체 ${todays.length}개`;list('todaylist',todays,'등록된 할 일이 없습니다');list('pastlist',tasks.filter(t=>t.date<today&&!t.done),'지난 미완료 일정이 없습니다');list('selectedlist',tasks.filter(t=>t.date===selected),'등록된 할 일이 없습니다');$('selectedlabel').textContent=selected+' 할 일';calendar();}
function calendar(){$('monthlabel').textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월`;$('calendar').replaceChildren();for(let i=0;i<month.getDay();i++)$('calendar').append(el('div','blank'));const end=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let n=1;n<=end;n++){const d=datekey(new Date(month.getFullYear(),month.getMonth(),n));const b=button('',()=>{selected=d;if(!editing)$('date').value=d;render();});b.className='day'+(d===selected?' selected':'')+(d===today?' istoday':'');b.setAttribute('aria-label',d+' 일정 보기');b.setAttribute('aria-pressed',String(d===selected));b.append(el('span','daynum',n));const ts=sorted(tasks.filter(t=>t.date===d));ts.slice(0,3).forEach(t=>{const p=el('span','preview'+(t.done?' done':''),t.title);p.title=t.title;b.append(p);});if(ts.length>3)b.append(el('span','more',`외 ${ts.length-3}개`));$('calendar').append(b);}}
function reset(){editing=null;$('form').reset();$('date').value=selected;$('formtitle').textContent='새 할 일';$('save').textContent='저장하기';$('cancel').hidden=true;$('formerror').textContent='';}
function edit(t){editing=t.id;$('title').value=t.title;$('date').value=t.date;$('time').value=t.time;$('priority').value=t.priority;$('formtitle').textContent='할 일 수정';$('save').textContent='수정 완료';$('cancel').hidden=false;$('formerror').textContent='';$('title').focus();}
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),date=$('date').value,time=$('time').value.trim(),priority=Number($('priority').value);let error='',field='title';if(!title)error='할 일 제목을 입력해 주세요.';else if(!validDate(date)||!$('date').validity.valid){error='유효한 예정일을 입력해 주세요.';field='date';}else if(time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){error='마감 시간은 00:00~23:59 형식으로 입력해 주세요.';field='time';}else if(!Number.isInteger(priority)||priority<1||priority>5){error='중요도를 선택해 주세요.';field='priority';}$('formerror').textContent=error;if(error){$(field).focus();return;}if(editing){const t=tasks.find(t=>t.id===editing);Object.assign(t,{title,date,time,priority});}else tasks.push({id:Date.now().toString(36)+'-'+(++serial),order:serial,title,date,time,priority,done:false});save();reset();render();};
$('cancel').onclick=reset;$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);calendar();};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);calendar();};$('gotoday').onclick=()=>{const now=new Date();selected=datekey(now);month=new Date(now.getFullYear(),now.getMonth(),1);if(!editing)$('date').value=selected;render();};window.addEventListener('focus',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});setInterval(render,60000);reset();render();
})();
</script>
</html>
